<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ButterDog Search</title>
  <link rel="stylesheet" href="./css/search.css">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <meta name="description" content="A really fire search engine">
  <meta name="keywords" content="search engine, search, butterdog, butterdog search">
  <meta name="author" content="ButterDogCo">
  <meta name="canonical" content="https://search.butterdogco.com/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="fadeIn">
  <nav>
    <div class="left">
      <a class="logo" href="./"></a>
  
      <div class="searchBar">
        <span class="icon material-symbols-rounded">search</span>
        <form autocomplete="off" class="autocomplete" action="./search" method="get" id="searchForm">
          <input class="input" id="searchInput" type="search" name="query" title="Search" placeholder="Search..." required>
          <div id="autocomplete-list" class="autocomplete-items"></div>
        </form>
      </div>
    </div>

    <div class="right">
      <ul class="options">
        <li>
          <button onclick="window.invertTheme()" title="Toggle light/dark mode" class="iconButton">
            <span class="icon material-symbols-rounded">contrast</span>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <main>
    <noscript>
      <p style="text-align: center; font-size: 18px; color: rgb(255, 61, 61);">JavaScript is disabled in your browser. Please enable JavaScript to use ButterDog Search.</p>
    </noscript>

    <div id="specialResultContainer" class="specialResultContainer" hidden></div>
    <p id="resultCount" class="resultCount"></p>
    <ul id="resultsList" class="resultsList"></ul>
  </main>

  <footer>
    <ul>
      <li><a href="./about">About</a></li>
      <li><a href="./about#search">How Search Works</a></li>
      <li><a href="https://butterdogco.com">ButterDogCo</a></li>
    </ul>

    <ul>
      <li><a href="https://butterdogco.com/terms">Terms</a></li>
      <li><a href="https://butterdogco.com/privacy">Privacy</a></li>
    </ul>
  </footer>

  <script src="./js/autocomplete.js" type="module"></script>
  <script src="./js/search.js" type="module"></script>
  <script src="./js/theme.js" type="module"></script>
</body>

</html>
