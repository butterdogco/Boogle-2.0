<!DOCTYPE html>
<html>

<head>
  <link rel="icon" href="./img/boogle_square.png">
  <link rel="stylesheet" href="./css/blue.css">
  <title>Boogle</title>
  <meta name="description" content="boogle, the best search engine">
  <meta name="author" content="ButterDogCo">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div class="main">
    <center>
      <header>
        <ul>
          <li><a class="signinbutton" href="#">Sign in</a></li>
          <li><a href="https://butterdogco.com/applications"><img class="apps"
                src="./img/apps-dark.png" title="Boogle apps"></a></li>
          <li><a href="images">Images</a></li>
          <li><a href="https://mail.google.com">Bmail</a></li>
        </ul>
      </header>
      <div class="searchmain">
        <div class="logo">
          <img alt="Boogle" src="./img/boogle-dark.png" style="height: 150px;">
        </div>
        <div class="bar">
          <img class="icon" src="./img/magnifying_glass.webp">
          <form autocomplete="off" method="get" action="https://sites.google.com/search/butter-dog-search?query=">
            <input id="myInput" class="searchbar" type="search" name="query" title="Search Boogle" />
        </div>
        <div class="buttons">
          <button class="button" type="submit">Boogle Search</button>
          </form>
          <a href="https://sites.google.com/search/butter-dog-search?query=how%20to&scope=site&showTabs=false"
            class="button" type="button">I'm Feeling Lucky</a>
        </div>
      </div>
    </center>
    <div class="footer">
      <li class="left"><a href="./about">About</a></li>
      <!-- <li class="left"><a href="https://butterdogco.github.io/advertising">Advertising</a></li> -->
      <li class="left"><a href="./about">How Search works</a></li>
      <li class="right"><a href="./themes">Themes</a></li>
      <li class="right"><a href="https://butterdogco.com/tos">Terms</a></li>
      <li class="right"><a href="https://butterdogco.com/pp">Privacy</a></li>
    </div>
    <script src="./js/autocomplete.js"></script>
  </div>
</body>

</html>
